name: Deploy vLLM to EC2

on:
  push:
    branches: [qa]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  INSTANCE_TYPE: ${{ vars.EC2_INSTANCE_TYPE || 'g5.xlarge' }}
  INFER_MODEL: ${{ vars.INFER_MODEL || 'Qwen/Qwen2.5-7B-Instruct' }}
  VLLM_IMAGE: ${{ vars.VLLM_IMAGE || 'vllm/vllm-openai:cu130-nightly' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      elastic_ip: ${{ steps.eip.outputs.elastic_ip }}

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve security group
        id: sg
        run: |
          REGION="${{ env.AWS_REGION }}"
          SG_INPUT="${{ vars.AWS_SECURITY_GROUP_ID || 'ec2' }}"
          if [[ "$SG_INPUT" == sg-* ]]; then
            echo "group_id=$SG_INPUT" >> $GITHUB_OUTPUT
          else
            SG_ID=$(aws ec2 describe-security-groups \
              --filters "Name=group-name,Values=$SG_INPUT" \
              --region $REGION \
              --query 'SecurityGroups[0].GroupId' --output text)
            echo "group_id=$SG_ID" >> $GITHUB_OUTPUT
          fi

      - name: Find or create EC2 instance
        id: ec2
        run: |
          REGION="${{ env.AWS_REGION }}"
          INSTANCE_NAME="ecs-gpu-vllm-inference"
          SG_ID="${{ steps.sg.outputs.group_id }}"
          EXISTING=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running,stopped" \
            --region $REGION \
            --query 'Reservations[0].Instances[0].InstanceId' --output text 2>/dev/null || echo "")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "None" ]; then
            echo "Using existing instance: $EXISTING"
            INSTANCE_ID="$EXISTING"
            echo "created=false" >> $GITHUB_OUTPUT
            STATE=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --region $REGION --query 'Reservations[0].Instances[0].State.Name' --output text)
            if [ "$STATE" = "stopped" ]; then
              aws ec2 start-instances --instance-ids $INSTANCE_ID --region $REGION
            fi
          else
            echo "Creating new instance: $INSTANCE_NAME"
            if [ -n "${{ vars.AWS_AMI_ID }}" ]; then
              AMI="${{ vars.AWS_AMI_ID }}"
            else
              AMI=$(aws ssm get-parameters \
                --names /aws/service/ecs/optimized-ami/amazon-linux-2/gpu/recommended \
                --region $REGION \
                --query 'Parameters[0].Value' --output text | jq -r '.image_id')
            fi
            EXTRA_ARGS=""
            if [ -n "${{ vars.EC2_SUBNET_ID }}" ]; then
              EXTRA_ARGS="--subnet-id ${{ vars.EC2_SUBNET_ID }}"
            fi
            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id $AMI \
              --instance-type ${{ env.INSTANCE_TYPE }} \
              --key-name ${{ vars.EC2_KEY_PAIR || 'ec2' }} \
              --security-group-ids $SG_ID \
              $EXTRA_ARGS \
              --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=$INSTANCE_NAME},{Key=workflow,Value=deploy}]" \
              --user-data '#!/bin/bash
            echo ECS_ENABLE_GPU_SUPPORT=true >> /etc/ecs/ecs.config 2>/dev/null || true
            yum install -y docker || true
            systemctl start docker 2>/dev/null || true
            usermod -aG docker ec2-user 2>/dev/null || true
            distribution=$(. /etc/os-release;echo $ID$VERSION_ID)
            curl -s -L https://nvidia.github.io/libnvidia-container/$distribution/libnvidia-container.repo | tee /etc/yum.repos.d/nvidia-container-toolkit.repo
            yum install -y nvidia-container-toolkit
            nvidia-ctk runtime configure --runtime=docker
            systemctl restart docker
            ' \
              --region $REGION \
              --query 'Instances[0].InstanceId' --output text)
            echo "created=true" >> $GITHUB_OUTPUT
          fi
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Wait for instance running
        run: |
          aws ec2 wait instance-running --instance-ids ${{ steps.ec2.outputs.instance_id }} --region ${{ env.AWS_REGION }}

      - name: Get instance IP
        id: eip
        run: |
          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"
          REGION="${{ env.AWS_REGION }}"
          CREATED="${{ steps.ec2.outputs.created }}"
          EIP=""
          if [ "$CREATED" = "false" ]; then
            echo "Reusing instance, getting existing IP"
            sleep 5
            EIP=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --region $REGION --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
            if [ -z "$EIP" ] || [ "$EIP" = "None" ]; then
              echo "Instance has no public IP. Associate an EIP manually or set EC2_ELASTIC_IP_ALLOCATION_ID."
              exit 1
            fi
          elif [ -n "${{ vars.EC2_ELASTIC_IP_ALLOCATION_ID }}" ]; then
            ALLOC_ID="${{ vars.EC2_ELASTIC_IP_ALLOCATION_ID }}"
            ASSOC_ID=$(aws ec2 describe-addresses --allocation-ids $ALLOC_ID --region $REGION --query 'Addresses[0].AssociationId' --output text 2>/dev/null || echo "")
            if [ -n "$ASSOC_ID" ] && [ "$ASSOC_ID" != "None" ]; then
              aws ec2 disassociate-address --association-id $ASSOC_ID --region $REGION
              sleep 5
            fi
            aws ec2 associate-address --instance-id $INSTANCE_ID --allocation-id $ALLOC_ID --region $REGION
            EIP=$(aws ec2 describe-addresses --allocation-ids $ALLOC_ID --region $REGION --query 'Addresses[0].PublicIp' --output text)
          else
            if ALLOC_ID=$(aws ec2 allocate-address --domain vpc --region $REGION --query 'AllocationId' --output text 2>/dev/null); then
              aws ec2 associate-address --instance-id $INSTANCE_ID --allocation-id $ALLOC_ID --region $REGION
              EIP=$(aws ec2 describe-addresses --allocation-ids $ALLOC_ID --region $REGION --query 'Addresses[0].PublicIp' --output text)
            else
              echo "EIP limit reached, using instance public IP"
              sleep 10
              EIP=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --region $REGION --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
              if [ -z "$EIP" ] || [ "$EIP" = "None" ]; then
                echo "No public IP. Launch instance in a public subnet or set EC2_ELASTIC_IP_ALLOCATION_ID."
                exit 1
              fi
            fi
          fi
          echo "elastic_ip=$EIP" >> $GITHUB_OUTPUT

      - name: Wait for SSH
        run: |
          INSTANCE_ID=${{ steps.ec2.outputs.instance_id }}
          for i in {1..30}; do
            if aws ec2 describe-instance-status --instance-ids $INSTANCE_ID --region ${{ env.AWS_REGION }} --query 'InstanceStatuses[0].InstanceStatus.Status' --output text 2>/dev/null | grep -q ok; then
              echo "Instance ready"
              break
            fi
            echo "Waiting for instance... ($i/30)"
            sleep 20
          done
          sleep 60

      - name: Deploy vLLM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.eip.outputs.elastic_ip }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker rm -f vllm 2>/dev/null || true
            docker run -d --name vllm --gpus all --shm-size 4g -p 8000:8000 \
              -e HF_TOKEN=${{ secrets.HUGGING_FACE_HUB_TOKEN }} \
              ${{ env.VLLM_IMAGE }} \
              --model ${{ env.INFER_MODEL }}

      - name: Output
        run: |
          echo "Elastic IP: ${{ steps.eip.outputs.elastic_ip }}"
          echo "Test: curl http://${{ steps.eip.outputs.elastic_ip }}:8000/v1/chat/completions -H 'Content-Type: application/json' -d '{\"model\":\"Qwen/Qwen2.5-7B-Instruct\",\"messages\":[{\"role\":\"user\",\"content\":\"hello\"}]}'"
